<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Arcana</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a14; overflow: hidden; }
      canvas { display: block; }

      :root {
        --ink: #cbd5f5;
        --ink-dim: #6b7aa8;
        --panel: rgba(10, 10, 20, 0.55);
        --edge: rgba(120, 140, 220, 0.18);
      }

      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font: 500 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--ink);
        letter-spacing: 0.04em;
      }

      .hud__clock {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 30px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
      }

      .hud__panel {
        position: absolute;
        left: 18px;
        bottom: 18px;
        max-width: min(560px, calc(100vw - 36px));
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }

      .hud__row { display: flex; gap: 10px; }
      .hud__label { color: var(--ink-dim); }
      .hud__keys { margin-top: 8px; color: var(--ink-dim); font-size: 12px; }

      .hud__kinds { display: flex; gap: 12px; margin-top: 6px; }
      .hud__kind { color: var(--ink-dim); }
      .hud__kind--chosen { color: var(--ink); text-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
      .hud__kind--broke { opacity: 0.4; }
      .hud__paused { color: #fbbf24; }

      .hud__warning {
        position: absolute;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(720px, 90vw);
        padding: 10px 16px;
        color: #fca5a5;
        background: rgba(40, 10, 16, 0.85);
        border: 1px solid rgba(248, 113, 113, 0.45);
        border-radius: 10px;
      }

      .inspector {
        position: absolute;
        right: 18px;
        top: 18px;
        width: min(340px, 42vw);
        padding: 12px 14px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }
      .inspector__title { margin-bottom: 8px; font-size: 15px; }
      .inspector__rules { margin: 0; padding: 0; list-style: none; }
      .inspector__rule { padding: 3px 6px; border-radius: 6px; color: var(--ink-dim); }
      .inspector__rule--active {
        color: #0a0a14;
        background: #fde047;
      }
      .inspector__target { margin-top: 8px; color: var(--ink-dim); font-size: 12px; }
      .inspector__hint { margin-top: 6px; color: var(--ink-dim); font-size: 11px; }

      .hud__refused { animation: refused 500ms ease; }
      @keyframes refused {
        0%, 100% { color: var(--ink); }
        30% { color: #f87171; }
      }

      .hud__outcome {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 18px 34px;
        font-size: 26px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 14px;
        backdrop-filter: blur(8px);
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .hud__outcome { pointer-events: none; }
      .hud__outcome--shown { opacity: 1; pointer-events: auto; }
      .hud__outcome small { display: block; margin-top: 6px; font-size: 14px; color: var(--ink-dim); }

      .hud__actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
      .hud__actions[hidden] { display: none; }

      .button {
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        letter-spacing: 0.04em;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .button:hover { border-color: rgba(34, 211, 238, 0.5); }
      .button--main { border-color: rgba(34, 211, 238, 0.7); box-shadow: 0 0 12px rgba(34, 211, 238, 0.2); }
      .button:disabled { opacity: 0.4; cursor: not-allowed; }

      /* На Подготовке времени нет: часы, Эфир и темп не нужны. */
      body[data-phase="prep"] .hud__clock,
      body[data-phase="prep"] .hud__panel,
      body[data-phase="prep"] .hud__warning { display: none; }

      .prep {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 18px 22px;
        font: 500 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--ink);
        letter-spacing: 0.04em;
        background: rgba(10, 10, 20, 0.88);
        border: 1px solid var(--edge);
        border-radius: 14px;
        backdrop-filter: blur(8px);
      }
      .prep__title { margin: 0 0 12px; font-size: 22px; font-weight: 600; text-shadow: 0 0 18px rgba(34, 211, 238, 0.35); }
      .prep__warning {
        margin-bottom: 12px;
        padding: 8px 12px;
        color: #fca5a5;
        background: rgba(40, 10, 16, 0.85);
        border: 1px solid rgba(248, 113, 113, 0.45);
        border-radius: 10px;
      }
      .prep__tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
      .prep__tab--active { border-color: rgba(34, 211, 238, 0.7); box-shadow: 0 0 12px rgba(34, 211, 238, 0.25); }
      .prep__card {
        display: grid;
        grid-template-columns: repeat(2, max-content 1fr);
        gap: 4px 14px;
        margin: 0 0 14px;
        padding: 10px 12px;
        border: 1px solid var(--edge);
        border-radius: 10px;
      }
      @media (max-width: 520px) { .prep__card { grid-template-columns: max-content 1fr; } }
      .prep__stat-label { color: var(--ink-dim); }
      .prep__stat-value { margin: 0; }
      .prep__rules { margin: 0 0 10px; padding-left: 26px; }
      .prep__rule { padding: 3px 0; }
      .prep__kind { margin: 14px 0 6px; font-size: 15px; font-weight: 600; }
      .prep__note { margin: 6px 0 12px; color: var(--ink-dim); font-size: 12px; }
      .prep__footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--edge);
      }
      .prep__seed-input {
        width: 10ch;
        font: inherit;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .prep__error { color: #fca5a5; font-size: 12px; }
      .prep__start { margin-left: auto; }
    </style>
  </head>
  <body data-phase="prep">
    <canvas id="stage"></canvas>

    <div class="hud">
      <div class="hud__clock" id="hud-clock">00:00</div>
      <div class="hud__outcome" id="hud-outcome">
        <div id="hud-outcome-text"></div>
        <div class="hud__actions" id="outcome-actions" hidden>
          <button type="button" class="button button--main" id="outcome-replay">Переиграть</button>
          <button type="button" class="button" id="outcome-edit">Изменить Правила</button>
          <button type="button" class="button" id="outcome-new-seed">Новый Сид</button>
        </div>
      </div>
      <div class="hud__warning" id="hud-warning" hidden></div>
      <div class="inspector" id="inspector" hidden>
        <div class="inspector__title" id="inspector-title"></div>
        <ol class="inspector__rules" id="inspector-rules"></ol>
        <div class="inspector__target" id="inspector-target"></div>
        <div class="inspector__hint">клик по Юниту снова или Esc — снять выделение</div>
      </div>
      <div class="hud__panel">
        <div class="hud__row"><span class="hud__label">эфир</span><span id="hud-ether">—</span></div>
        <div class="hud__kinds" id="hud-kinds"></div>
        <div class="hud__row"><span class="hud__label">темп</span><span id="hud-speed">×1</span></div>
        <div class="hud__row"><span class="hud__label">Сид</span><span id="hud-seed">—</span></div>
        <div class="hud__keys">1-3 — тип Юнита · клик по Дороге — отправить · клик по Юниту — его Правила · пробел — пауза · − = — темп</div>
      </div>
    </div>

    <section class="prep" id="prep" hidden>
      <h1 class="prep__title">Подготовка</h1>
      <div class="prep__warning" id="prep-warning" hidden></div>
      <nav class="prep__tabs" id="prep-tabs"></nav>
      <div id="prep-body"></div>
      <footer class="prep__footer">
        <label>Сид <input class="prep__seed-input" id="prep-seed" type="text" inputmode="numeric" autocomplete="off" /></label>
        <span class="prep__error" id="prep-seed-error" hidden>Сид — целое неотрицательное число</span>
        <button type="button" class="button button--main prep__start" id="prep-start">Начать матч</button>
      </footer>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
