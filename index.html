<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Arcana</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0a0a12;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      #game-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }

      #game-canvas {
        background-color: #12121a;
        border: 2px solid #2a2a3a;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
      }

      /* Loading screen */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a12;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        transition: opacity 0.5s ease-out;
      }

      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loading h1 {
        font-size: 3rem;
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        margin-bottom: 20px;
        letter-spacing: 4px;
      }

      #loading p {
        color: #666;
        font-size: 1rem;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid #1a1a2a;
        border-top: 3px solid #00ffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-top: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>NEON ARCANA</h1>
      <p>Загрузка...</p>
      <div class="loading-spinner"></div>
    </div>

    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <script type="module" src="/src/client/index.ts"></script>
  </body>
</html>
